# Run a selected Docker publishing task from GitLab's New pipeline page.
# Pushes do not publish images automatically.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

variables:
  TASK_TYPE:
    value: docker-publish
    options:
      - docker-publish
      - docker-multiarch
    description: "docker-publish: linux/amd64 image; docker-multiarch: linux/amd64 and linux/arm64 images"
  DOCKER_IMAGE:
    value: ""
    description: "Optional Docker Hub repository; defaults to DOCKER_USERNAME/casdoor"
  GIT_DEPTH: "0"

stages:
  - prepare
  - publish

include:
  - local: '/.gitlab/ci/docker-common.yml'
  - local: '/.gitlab/ci/docker-publish.yml'
  - local: '/.gitlab/ci/docker-multiarch.yml'
