name: Docker Publish

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for publishing"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Casdoor stamps its version from Git history during the Docker build.
          fetch-depth: 0

      - name: Determine image version
        shell: bash
        run: |
          VERSION=$(git describe --tags --always)
          if [[ ! "$VERSION" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "::error::Git version is not a valid Docker tag: $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building version: $VERSION"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: STANDARD
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/casdoor:latest
            ${{ secrets.DOCKER_USERNAME }}/casdoor:${{ env.VERSION }}
          cache-from: type=gha,scope=casdoor-standard
          cache-to: type=gha,scope=casdoor-standard,mode=max
