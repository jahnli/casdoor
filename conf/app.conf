# 应用名称。
appname = casdoor
# HTTP 服务监听端口。
httpport = 8000
# 运行模式：dev 为开发模式，prod 为生产模式。
runmode = dev
# 保留请求体副本，供控制器读取和解析。
copyrequestbody = true

# 数据库驱动，当前使用 PostgreSQL。
driverName = postgres
# 数据库连接串：通过同名环境变量或本地 .env 文件配置。
dataSourceName =
# 数据库名称。
dbName = casdoor
# 数据表名称前缀，留空表示不添加前缀。
tableNamePrefix =
# 是否输出 SQL 日志。
showSql = false
# Redis 服务地址，留空表示不配置 Redis。
redisEndpoint =

# 默认头像存储提供者的名称（admin 所有），留空时不转存外部头像。
defaultStorageProvider =
# 是否优先使用已配置的云服务内网地址。
isCloudIntranet = false
# 登录认证时用于校验的预设 state 值。
authState = "casdoor"
# SOCKS5 代理地址，供支持代理的外部请求使用。
socks5Proxy = "127.0.0.1:10808"
# 验证码有效期，单位：分钟；未配置或值无效时使用 10 分钟。
verificationCodeTimeout = 10
# 请求审计主要记录 POST 请求；部分安全相关的 GET 接口仍会记录。
logPostOnly = true
# 是否将用户名统一转换为小写。
isUsernameLowered = false

# 后端对外访问地址（含协议和端口），用于生成服务地址等。
origin =
# 前端对外访问地址；前后端分离部署时可单独指定。
originFrontend =
# 静态资源的基础地址。
staticBaseUrl = "https://cdn.casbin.org"
# 是否启用演示模式。
isDemoMode = false
# 批量数据库操作每批处理的条目数。
batchSize = 100
# 是否显示页面上的 GitHub 角标。
showGithubCorner = false
# 强制使用的界面语言，留空表示不强制。
forceLanguage = ""
# 默认界面语言，如 en、zh。
defaultLanguage = "en"
# 默认应用的名称。
defaultApplication = "app-built-in"
# 菜单平铺显示的条目数上限，超过后使用分组菜单。
maxItemsForFlatMenu = 7
# 是否隐藏错误详情，向用户返回经过掩码处理的错误信息。
enableErrorMask = false
# 是否启用静态资源的 Gzip 压缩。
enableGzip = true
# 会话无操作超时时间，单位：分钟；留空或小于等于 0 时禁用。
inactiveTimeoutMinutes =

# LDAP 服务监听端口。
ldapServerPort = 389
# LDAPS 使用的证书 ID（所有者/名称）；留空时不启动 LDAPS。
ldapsCertId = ""
# LDAPS 服务监听端口。
ldapsServerPort = 636
# RADIUS 服务监听端口。
radiusServerPort = 1812
# RADIUS 认证使用的默认组织。
radiusDefaultOrganization = "built-in"
# RADIUS 服务与客户端之间的共享密钥。
radiusSecret = "secret"

# 组织、用户、应用和提供者的数量配额，-1 表示不限制。
quota = {"organization": -1, "user": -1, "application": -1, "provider": -1}
# 日志配置：输出方式、文件路径、保留天数和文件权限（八进制）。
logConfig = {"adapter":"file", "filename": "logs/casdoor.log", "maxdays":99999, "perm":"0770"}
# 初始化数据是否只新增对象：true 跳过已有对象，false 允许更新已有对象。
initDataNewOnly = false
# 启动时加载的初始化数据文件路径。
initDataFile = "./init_data.json"
# 本地 web/build 不存在时，用于查找前端构建产物的备用目录。
frontendBaseDir = "../cc_0"
