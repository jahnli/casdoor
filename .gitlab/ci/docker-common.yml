# The available instance runner uses the "public" tag. Override RUNNER_TAG to
# select a dedicated Linux/amd64 Docker runner when available.
# Publishing requires a Docker executor with privileged mode and these volumes:
#   privileged = true
#   volumes = ["/certs/client", "/cache"]
# Required masked CI/CD variables: DOCKER_USERNAME and DOCKER_TOKEN.
# Protected variables are only available on protected branches or tags.

.linux-container:
  tags:
    - $RUNNER_TAG

prepare-version:
  extends: .linux-container
  stage: prepare
  image:
    name: alpine/git:2.47.2
    entrypoint: [""]
  rules:
    - if: "$TASK_TYPE =~ /^(docker-publish|docker-multiarch)$/"
  script:
    - |
      BUILD_VERSION=$(git describe --tags --always)
      if ! printf '%s\n' "$BUILD_VERSION" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
        echo "The version must be a valid Docker tag."
        exit 1
      fi
      printf '%s\n' "$BUILD_VERSION" > VERSION
      echo "Building version: $BUILD_VERSION"
  artifacts:
    paths:
      - VERSION
    expire_in: 7 days

.docker-publish:
  extends: .linux-container
  stage: publish
  image: docker:29.10.0-cli
  services:
    - name: docker:29.10.0-dind
      alias: docker
      variables:
        HEALTHCHECK_TCP_PORT: "2376"
  needs:
    - prepare-version
  resource_group: casdoor-docker-publish
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
    BUILD_PLATFORMS: linux/amd64
  before_script:
    - ': "${DOCKER_USERNAME:?Set DOCKER_USERNAME in GitLab CI/CD variables}"'
    - ': "${DOCKER_TOKEN:?Set DOCKER_TOKEN in GitLab CI/CD variables}"'
    - export DOCKER_IMAGE="${DOCKER_IMAGE:-$DOCKER_USERNAME/casdoor}"
    - docker info
    - printf '%s' "$DOCKER_TOKEN" | docker login --username "$DOCKER_USERNAME" --password-stdin
    - if [ "$BUILD_PLATFORMS" != "linux/amd64" ]; then docker run --privileged --rm tonistiigi/binfmt --install arm64; fi
    - docker buildx create --driver docker-container --use
    - docker buildx inspect --bootstrap
  script:
    - VERSION=$(cat VERSION)
    - |
      docker buildx build \
        --file Dockerfile \
        --target STANDARD \
        --platform "$BUILD_PLATFORMS" \
        --tag "$DOCKER_IMAGE:latest" \
        --tag "$DOCKER_IMAGE:$VERSION" \
        --cache-from "type=registry,ref=$DOCKER_IMAGE:latest" \
        --cache-to type=inline \
        --push .
    - docker buildx imagetools inspect "$DOCKER_IMAGE:$VERSION"
